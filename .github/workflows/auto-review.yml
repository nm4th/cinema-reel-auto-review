name: ゲストレビュー自動投稿（スペマ＋インスタベース）

on:
  # cron-job.org または手動で実行
  workflow_dispatch:
    inputs:
      target_date:
        description: 'スペマ対象日 (YYYY-MM-DD, 空欄=今日)'
        required: false
        default: ''
      service:
        description: '対象サービス'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'spacemarket'
          - 'instabase'

env:
  SPACEMARKET_EMAIL: ${{ secrets.SPACEMARKET_EMAIL }}
  SPACEMARKET_PASSWORD: ${{ secrets.SPACEMARKET_PASSWORD }}
  DRY_RUN: 'false'

jobs:
  post-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: claude/automate-guest-reviews-fwB7Y

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: スクリーンショット用ディレクトリ作成
        run: mkdir -p screenshots

      - name: レビュー自動投稿を実行
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.target_date }}"
          fi

          SERVICE="${{ github.event.inputs.service || 'all' }}"

          echo "対象サービス: ${SERVICE}"
          echo "スペマ対象日: ${DATE_ARG:-今日}"
          echo "モード: 本番（自動投稿ON）"

          python main.py --no-dry-run --service "$SERVICE" $DATE_ARG

      - name: スクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore
