name: テスト - 単一ゲストレビュー投稿

on:
  workflow_dispatch:
    inputs:
      thread_id:
        description: '対象スレッドID'
        required: true
        default: '5275641'
      dry_run:
        description: 'ドライランモード (true = 投稿しない)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  SPACEMARKET_EMAIL: ${{ secrets.SPACEMARKET_EMAIL }}
  SPACEMARKET_PASSWORD: ${{ secrets.SPACEMARKET_PASSWORD }}

jobs:
  test-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: claude/automate-guest-reviews-fwB7Y

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: スクリーンショット用ディレクトリ作成
        run: mkdir -p screenshots

      - name: 単一レビュー投稿テスト実行
        run: |
          THREAD_ID="${{ github.event.inputs.thread_id }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          echo "対象スレッド: ${THREAD_ID}"
          echo "モード: DRY_RUN=${DRY_RUN}"

          export DRY_RUN

          if [ "$DRY_RUN" = "false" ]; then
            python test_single_review.py "$THREAD_ID" --no-dry-run
          else
            python test_single_review.py "$THREAD_ID"
          fi

      - name: スクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore
